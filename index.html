    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script>
        // Função para gerar números aleatórios
        function generateRandomNumbers(count, min = -100, max = 100) {
            return Array.from({length: count}, () => Math.floor(Math.random() * (max - min + 1)) + min);
        }

        // Função para gerar meses
        function generateMonths(count) {
            const months = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho'];
            return months.slice(0, count);
        }

        // Função para tornar cor transparente
        function transparentize(color, opacity) {
            return color.replace('rgb', 'rgba').replace(')', `, ${opacity})`);
        }

        // Dados do gráfico
        const labels = generateMonths(7);
        const data = {
            labels: labels,
            datasets: [
                {
                    label: 'Dataset 1',
                    data: generateRandomNumbers(7),
                    borderColor: 'rgb(255, 99, 132)',
                    backgroundColor: transparentize('rgb(255, 99, 132)', 0.5),
                    tension: 0.1
                },
                {
                    label: 'Dataset 2',
                    data: generateRandomNumbers(7),
                    borderColor: 'rgb(54, 162, 235)',
                    backgroundColor: transparentize('rgb(54, 162, 235)', 0.5),
                    tension: 0.1
                }
            ]
        };

        // Configuração do gráfico
        const config = {
            type: 'line',
            data: data,
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'top',
                    },
                    title: {
                        display: true,
                        text: 'Gráfico de Linha - SafraTech'
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        };

        // Criar o gráfico
        const ctx = document.getElementById('meuGrafico').getContext('2d');
        const meuGrafico = new Chart(ctx, config);
    </script>
