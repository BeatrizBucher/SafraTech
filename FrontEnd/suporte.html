    <script>
        const msgBox = document.getElementById("safrito-messages");

        function addMessage(text, sender = "bot") {
            const div = document.createElement("div");
            div.classList.add("msg", sender);
            div.textContent = text;
            msgBox.appendChild(div);
            msgBox.scrollTop = msgBox.scrollHeight;
        }

        function safritoResponse(option) {

            switch (option) {

                case "status":
                    const tempAgora = localStorage.getItem("temperaturaAgora") || "--";
                    const umidAgora = localStorage.getItem("umidadeAgora") || "--";
                    const condAgora = localStorage.getItem("condicaoAgora") || "--";

                    return `📊 *Clima Atual:*\n
                        🌡 Temperatura: ${tempAgora}°C
                        💧 Umidade: ${umidAgora}%   
                        🌦 Condição: ${condAgora}`;


                case "irrigacao":
                    return "💧 Para controlar a irrigação, utilize os botões no menu lateral.\nSe precisar de ajuda, é só chamar!";

                case "alertas":
                    return "✔️ Nenhum alerta ativo no momento.\nTudo está funcionando normalmente.";

                case "info":
                    return "ℹ️ Eu sou o Safrito, seu assistente virtual da SafraTech!\nPosso ajudar com sensores, irrigação e muito mais.";

                default:
                    return "Desculpe, não entendi sua escolha.";
            }
        }

        document.querySelectorAll(".safrito-btn").forEach(btn => {
            btn.addEventListener("click", () => {

                const userText = btn.innerText;
                const option = btn.getAttribute("data-msg");

                addMessage(userText, "user");

                setTimeout(() => {
                    addMessage(safritoResponse(option), "bot");
                }, 500);
            });
        });
    </script>
